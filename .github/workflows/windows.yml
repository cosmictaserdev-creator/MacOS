name: Windows portable build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish portable executable
        run: dotnet publish MacOSDock.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o dist
      - name: Verify artifact
        shell: pwsh
        run: |
          if (!(Test-Path dist/MacOSDock.exe)) { throw 'Portable executable was not produced' }
          Get-Item dist/MacOSDock.exe | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: MacOSDock-Windows-x64
          path: dist/MacOSDock.exe
          if-no-files-found: error
